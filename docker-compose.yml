services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: videoteca
      POSTGRES_USER: videoteca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations versionadas — o entrypoint roda em ordem alfabética (001 → 012)
      # só na PRIMEIRA subida (volume pgdata vazio). Banco já existente: aplique
      # as novas manualmente (docs/RELEASE.md, seção "Migrations").
      # Ao criar a migration 013+, acrescente-a aqui.
      - ./db/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./db/migrations/002_constraints_indexes.sql:/docker-entrypoint-initdb.d/002_constraints_indexes.sql:ro
      - ./db/migrations/003_anticonflict.sql:/docker-entrypoint-initdb.d/003_anticonflict.sql:ro
      - ./db/migrations/004_room_request_details.sql:/docker-entrypoint-initdb.d/004_room_request_details.sql:ro
      - ./db/migrations/005_equipment_loans.sql:/docker-entrypoint-initdb.d/005_equipment_loans.sql:ro
      - ./db/migrations/006_film_posters.sql:/docker-entrypoint-initdb.d/006_film_posters.sql:ro
      - ./db/migrations/007_sessions.sql:/docker-entrypoint-initdb.d/007_sessions.sql:ro
      - ./db/migrations/008_session_occupancy.sql:/docker-entrypoint-initdb.d/008_session_occupancy.sql:ro
      - ./db/migrations/009_film_rights.sql:/docker-entrypoint-initdb.d/009_film_rights.sql:ro
      - ./db/migrations/010_rights_proofs.sql:/docker-entrypoint-initdb.d/010_rights_proofs.sql:ro
      - ./db/migrations/011_privacy.sql:/docker-entrypoint-initdb.d/011_privacy.sql:ro
      - ./db/migrations/012_performance.sql:/docker-entrypoint-initdb.d/012_performance.sql:ro
      # Seed de desenvolvimento (roda por último por ordem do nome)
      - ./db/seed/seed_dev.sql:/docker-entrypoint-initdb.d/zzz_seed_dev.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoteca"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://videoteca:${POSTGRES_PASSWORD}@postgres:5432/videoteca
    # Healthcheck vem do Dockerfile (GET /health).
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
